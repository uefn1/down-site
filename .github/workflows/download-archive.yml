name: Download Wayback Machine Archive via WARP

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするサイトのホスト名 (例: www.nintendo.com、スキームは不要)'
        required: true
        default: 'example.com'
      snapshot_timestamp:
        description: 'スナップショットのタイムスタンプ (YYYYMMDDHHMMSS形式、空欄の場合は最新を自動取得)'
        required: false
        default: ''
      crawl_depth:
        description: 'リンクを辿る深さ (1=メインページのみ)'
        required: false
        default: '2'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------
      # Cloudflare WARP を SOCKS5 プロキシとして起動
      # ------------------------------------------------------------
      - name: Setup Cloudflare WARP proxy (SOCKS5)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          sudo systemctl start warp-svc || true
          warp-cli --accept-tos registration delete || true
          script -qec "warp-cli --accept-tos registration new" /dev/null

          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          sleep 5

      - name: Verify WARP SOCKS5 proxy
        run: |
          curl --socks5 127.0.0.1:40000 -sL https://cloudflare.com/cdn-cgi/trace | grep warp
      # ------------------------------------------------------------

      # ------------------------------------------------------------
      # Privoxy で SOCKS5 (WARP) を HTTP プロキシに変換
      # ------------------------------------------------------------
      - name: Setup Privoxy (SOCKS5 → HTTP proxy)
        run: |
          sudo apt-get install -y privoxy

          # Privoxy 設定: 8118 で待ち受け、全リクエストを WARP の SOCKS5 (40000) へ転送
          sudo tee /etc/privoxy/config > /dev/null <<'EOF'
          listen-address  127.0.0.1:8118
          forward-socks5  /  127.0.0.1:40000  .
          debug           1
          EOF

          sudo systemctl restart privoxy
          sleep 3

      - name: Verify HTTP proxy (Privoxy → WARP)
        run: |
          # Privoxy の HTTP プロキシ経由で WARP が有効か確認
          curl -x http://127.0.0.1:8118 -sL https://cloudflare.com/cdn-cgi/trace | grep warp
      # ------------------------------------------------------------

      - name: Install wbdownloader
        run: |
          git clone https://github.com/asofyan/wbdownloader.git
          cd wbdownloader
          pip install -r requirements.txt

      - name: Determine snapshot timestamp
        id: get_timestamp
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.snapshot_timestamp }}" ]; then
            echo "timestamp=${{ github.event.inputs.snapshot_timestamp }}" >> $GITHUB_OUTPUT
          else
            # HTTP プロキシ経由で CDX API を呼び出し
            LATEST_TS=$(curl -x http://127.0.0.1:8118 -s "https://web.archive.org/cdx/search/cdx?url=${{ github.event.inputs.target_url }}&output=json&limit=1&filter=statuscode:200&collapse=digest" | python -c "import sys,json; data=json.load(sys.stdin); print(data[1][1] if len(data) > 1 else '')")
            if [ -z "$LATEST_TS" ]; then
              echo "Error: スナップショットが見つかりませんでした。" >&2
              exit 1
            fi
            echo "timestamp=$LATEST_TS" >> $GITHUB_OUTPUT
          fi

      - name: Run wbdownloader (through HTTP proxy → WARP)
        run: |
          cd wbdownloader
          python wbdownloader.py \
            -f "${{ github.event.inputs.target_url }}" \
            -s "${{ steps.get_timestamp.outputs.timestamp }}" \
            -o "./downloaded-archive" \
            -l "${{ github.event.inputs.crawl_depth }}" \
            -c 5 \
            -p http://127.0.0.1:8118

      - name: Upload downloaded archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayback-archive-${{ github.run_number }}
          path: ./wbdownloader/downloaded-archive
          retention-days: 7
