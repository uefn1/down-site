name: Download Wayback Machine Archive (waybackpack)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするURL (スキーム含む。例: http://www.nintendo.com)'
        required: true
        default: 'http://example.com'
      from_date:
        description: '開始タイムスタンプ (YYYYMMDD形式、空欄なら最古から)'
        required: false
        default: ''
      to_date:
        description: '終了タイムスタンプ (YYYYMMDD形式、空欄なら最新まで)'
        required: false
        default: ''
      delay_seconds:
        description: 'リクエスト間の遅延（秒）。レート制限回避用'
        required: false
        default: '2'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install waybackpack
        run: pip install waybackpack

      - name: Build waybackpack arguments
        id: args
        shell: bash
        run: |
          ARGS="${{ github.event.inputs.target_url }} -d ./downloaded-archive"
          ARGS="$ARGS --delay ${{ github.event.inputs.delay_seconds }}"
          ARGS="$ARGS --max-retries 3"
          ARGS="$ARGS --ignore-errors"

          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            ARGS="$ARGS --from-date ${{ github.event.inputs.from_date }}"
          fi
          if [ -n "${{ github.event.inputs.to_date }}" ]; then
            ARGS="$ARGS --to-date ${{ github.event.inputs.to_date }}"
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run waybackpack
        run: waybackpack ${{ steps.args.outputs.args }}

      - name: Upload downloaded archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayback-archive-${{ github.run_number }}
          path: ./downloaded-archive
          retention-days: 7
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするサイトのホスト名 (例: www.nintendo.com、スキームは不要)'
        required: true
        default: 'example.com'
      snapshot_timestamp:
        description: 'スナップショットのタイムスタンプ (YYYYMMDDHHMMSS形式、空欄の場合は最新を自動取得)'
        required: false
        default: ''
      crawl_depth:
        description: 'リンクを辿る深さ (1=メインページのみ)'
        required: false
        default: '2'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install wbdownloader
        run: |
          git clone https://github.com/asofyan/wbdownloader.git
          cd wbdownloader
          pip install -r requirements.txt
          pip install playwright-stealth
          python setup_browser.py

      - name: Determine snapshot timestamp
        id: get_timestamp
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.snapshot_timestamp }}" ]; then
            echo "timestamp=${{ github.event.inputs.snapshot_timestamp }}" >> $GITHUB_OUTPUT
          else
            LATEST_TS=$(curl -s "https://web.archive.org/cdx/search/cdx?url=${{ github.event.inputs.target_url }}&output=json&limit=1&filter=statuscode:200&collapse=digest" | python -c "import sys,json; data=json.load(sys.stdin); print(data[1][1] if len(data) > 1 else '')")
            if [ -z "$LATEST_TS" ]; then
              echo "Error: スナップショットが見つかりませんでした。" >&2
              exit 1
            fi
            echo "timestamp=$LATEST_TS" >> $GITHUB_OUTPUT
          fi

      - name: Run wbdownloader (browser mode, reduced concurrency)
        run: |
          cd wbdownloader
          python wbdownloader.py \
            -f "${{ github.event.inputs.target_url }}" \
            -s "${{ steps.get_timestamp.outputs.timestamp }}" \
            -o "./downloaded-archive" \
            -l "${{ github.event.inputs.crawl_depth }}" \
            -c 2 \
            --sequential-assets \
            --browser --headless

      - name: Upload downloaded archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayback-archive-${{ github.run_number }}
          path: ./wbdownloader/downloaded-archive
          retention-days: 7
