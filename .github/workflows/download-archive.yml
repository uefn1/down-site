name: Download Wayback Machine Archive via WARP

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするサイトのURL (例: example.com)'
        required: true
        default: 'example.com'
      snapshot_timestamp:
        description: 'スナップショットのタイムスタンプ (YYYYMMDDHHMMSS形式、空欄の場合は最新を自動取得)'
        required: false
        default: ''
      crawl_depth:
        description: 'リンクを辿る深さ (1=メインページのみ)'
        required: false
        default: '2'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------
      # ここから WARP のセットアップ (プロキシモード)
      # ------------------------------------------------------------
      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Configure WARP in proxy mode
        run: |
          # 利用規約に同意して登録し、プロキシモードに切り替える
          warp-cli --accept-tos registration new
          warp-cli mode proxy
          warp-cli proxy port 40000   # ローカルプロキシのポート
          warp-cli connect
          sleep 5                     # 接続確立を待つ

      - name: Verify WARP connection
        run: |
          # プロキシ経由でWARPが有効になっているか確認 (warp=on が返ればOK)
          curl -x http://127.0.0.1:40000 -sL https://cloudflare.com/cdn-cgi/trace | grep warp
      # ------------------------------------------------------------
      # WARP セットアップここまで
      # ------------------------------------------------------------

      - name: Install wbdownloader
        run: |
          git clone https://github.com/asofyan/wbdownloader.git
          cd wbdownloader
          pip install -r requirements.txt

      - name: Determine snapshot timestamp
        id: get_timestamp
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.snapshot_timestamp }}" ]; then
            echo "timestamp=${{ github.event.inputs.snapshot_timestamp }}" >> $GITHUB_OUTPUT
          else
            LATEST_TS=$(curl -s -x http://127.0.0.1:40000 "https://web.archive.org/cdx/search/cdx?url=${{ github.event.inputs.target_url }}&output=json&limit=1&filter=statuscode:200&collapse=digest" | python -c "import sys,json; data=json.load(sys.stdin); print(data[1][1] if len(data) > 1 else '')")
            if [ -z "$LATEST_TS" ]; then
              echo "Error: スナップショットが見つかりませんでした。" >&2
              exit 1
            fi
            echo "timestamp=$LATEST_TS" >> $GITHUB_OUTPUT
          fi

      - name: Run wbdownloader through WARP proxy
        run: |
          cd wbdownloader
          python wbdownloader.py \
            -f "http://${{ github.event.inputs.target_url }}" \
            -s "${{ steps.get_timestamp.outputs.timestamp }}" \
            -o "./downloaded-archive" \
            -l "${{ github.event.inputs.crawl_depth }}" \
            -c 5 \
            -p http://127.0.0.1:40000   # ← WARP のローカルプロキシを指定

      - name: Upload downloaded archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayback-archive-${{ github.run_number }}
          path: ./wbdownloader/downloaded-archive
          retention-days: 7
