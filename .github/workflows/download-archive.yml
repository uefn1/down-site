name: Download Wayback Machine Archive

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするURL (スキーム含む。例: http://www.nintendo.com)'
        required: true
        default: 'http://example.com'
      max_snapshots:
        description: 'ダウンロードするスナップショットの最大個数'
        required: true
        default: '10'
      from_date:
        description: '開始タイムスタンプ (YYYYMMDD形式、空欄なら最古から)'
        required: false
        default: ''
      to_date:
        description: '終了タイムスタンプ (YYYYMMDD形式、空欄なら最新まで)'
        required: false
        default: ''
      delay_seconds:
        description: 'リクエスト間の遅延（秒）'
        required: false
        default: '2'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Download snapshots with assets
        id: download
        shell: bash
        run: |
          python - <<'PYEOF'
          import requests, time, os, sys, zipfile, shutil
          from urllib.parse import urlparse, urljoin
          from bs4 import BeautifulSoup

          url = "${{ github.event.inputs.target_url }}"
          max_n = int("${{ github.event.inputs.max_snapshots }}")
          delay = float("${{ github.event.inputs.delay_seconds }}")
          from_date = "${{ github.event.inputs.from_date }}"
          to_date = "${{ github.event.inputs.to_date }}"

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.5',
              'Connection': 'keep-alive',
          }

          session = requests.Session()
          session.headers.update(headers)

          cdx_params = {
              'url': url, 'output': 'json', 'limit': max_n,
              'filter': 'statuscode:200', 'collapse': 'digest',
          }
          if from_date: cdx_params['from'] = from_date
          if to_date: cdx_params['to'] = to_date

          print("Querying CDX API...")
          r = session.get('https://web.archive.org/cdx/search/cdx', params=cdx_params, timeout=60)
          if r.status_code != 200:
              print(f"CDX API error: HTTP {r.status_code}", file=sys.stderr); sys.exit(1)
          data = r.json()
          if len(data) < 2:
              print("No snapshots found.", file=sys.stderr); sys.exit(1)

          rows = data[1:]
          print(f"Found {len(rows)} snapshots (max={max_n}).")

          outdir = "downloaded-archive"
          os.makedirs(outdir, exist_ok=True)

          def fetch_asset(ts, asset_url, retries=2):
              """Wayback の id_ エンドポイントからアセットを取得"""
              wb_url = f"https://web.archive.org/web/{ts}id_/{asset_url}"
              for attempt in range(retries + 1):
                  try:
                      rr = session.get(wb_url, timeout=30, allow_redirects=True)
                      if rr.status_code == 200 and len(rr.content) > 0:
                          return rr.content
                      if rr.status_code == 429:
                          time.sleep(5 * (attempt + 1)); continue
                      return None
                  except Exception:
                      time.sleep(3)
              return None

          def local_rel_for(asset_url):
              p = urlparse(asset_url).path
              if not p or p.endswith('/'):
                  p += 'index.html'
              return p.lstrip('/')

          success = 0
          failed = 0

          for row in rows:
              ts, orig = row[1], row[2]
              snapdir = os.path.join(outdir, ts)
              os.makedirs(snapdir, exist_ok=True)

              # ① メインHTML取得
              main_raw = f"https://web.archive.org/web/{ts}id_/{orig}"
              try:
                  resp = session.get(main_raw, timeout=60)
              except Exception as e:
                  print(f"[{ts}] fetch error: {e}"); failed += 1; continue

              if resp.status_code != 200 or len(resp.content) == 0:
                  print(f"[{ts}] main HTTP {resp.status_code}, size {len(resp.content)} -> skip")
                  failed += 1
                  shutil.rmtree(snapdir, ignore_errors=True)
                  continue

              resp.encoding = resp.apparent_encoding or 'utf-8'
              soup = BeautifulSoup(resp.text, 'lxml')

              # ② HTML内のアセット参照を抽出
              tag_attrs = [
                  ('img', 'src'), ('script', 'src'), ('link', 'href'),
                  ('source', 'src'), ('video', 'src'), ('audio', 'src'), ('iframe', 'src'),
              ]
              asset_refs = {}   # absolute_url -> [(tag, attr, original_value)]
              for tag_name, attr in tag_attrs:
                  for tag in soup.find_all(tag_name):
                      val = tag.get(attr)
                      if not val or val.startswith(('data:', 'javascript:', '#', 'mailto:', 'tel:')):
                          continue
                      abs_url = urljoin(orig, val)
                      asset_refs.setdefault(abs_url, []).append((tag, attr, val))

              print(f"[{ts}] {len(asset_refs)} unique assets referenced")

              # ③ アセットをダウンロード
              downloaded = {}   # absolute_url -> local rel path
              for asset_url in asset_refs:
                  rel = local_rel_for(asset_url)
                  full = os.path.join(snapdir, rel)
                  os.makedirs(os.path.dirname(full) or snapdir, exist_ok=True)
                  content = fetch_asset(ts, asset_url)
                  if content:
                      with open(full, 'wb') as f:
                          f.write(content)
                      downloaded[asset_url] = rel
                      print(f"    ✓ {rel} ({len(content)}B)")
                  else:
                      print(f"    ✗ {asset_url}")
                  time.sleep(delay * 0.5)

              # ④ HTML内の参照をローカルパスへ書き換え
              for asset_url, refs in asset_refs.items():
                  if asset_url not in downloaded:
                      continue
                  local_rel = downloaded[asset_url]
                  for tag, attr, _ in refs:
                      tag[attr] = local_rel

              with open(os.path.join(snapdir, 'index.html'), 'w', encoding='utf-8') as f:
                  f.write(str(soup))

              # ⑤ スナップショットをZIP化
              zip_path = os.path.join(outdir, f"{ts}.zip")
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for root, _, files in os.walk(snapdir):
                      for fname in files:
                          full = os.path.join(root, fname)
                          arc = os.path.relpath(full, outdir)
                          zf.write(full, arc)
              print(f"[{ts}] packaged -> {ts}.zip")

              shutil.rmtree(snapdir, ignore_errors=True)
              success += 1
              time.sleep(delay)

          print(f"Done. Success: {success}, Failed: {failed}")
          PYEOF

      - name: Verify downloaded files
        run: |
          ZIPS=$(find downloaded-archive -maxdepth 1 -name '*.zip' | wc -l)
          if [ "$ZIPS" -eq 0 ]; then
            echo "No ZIP files were created." >&2
            exit 1
          fi
          echo "Created $ZIPS snapshot ZIP file(s)."
          ls -lah downloaded-archive

      - name: Create Release and upload snapshots
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wayback-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Wayback archive: ${{ github.event.inputs.target_url }} (${{ github.run_number }})"
          body: |
            Target URL: ${{ github.event.inputs.target_url }}
            Max snapshots: ${{ github.event.inputs.max_snapshots }}
            From: ${{ github.event.inputs.from_date || '(oldest)' }}
            To: ${{ github.event.inputs.to_date || '(latest)' }}

            Each `<timestamp>.zip` contains `index.html` (with rewritten asset paths) and its assets under the original path structure.
          files: |
            downloaded-archive/*.zip
          overwrite_files: true
