name: Download Wayback Machine Archive

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするURL (スキーム含む。例: http://www.nintendo.com)'
        required: true
        default: 'http://example.com'
      max_snapshots:
        description: 'ダウンロードするスナップショットの最大個数'
        required: true
        default: '10'
      from_date:
        description: '開始タイムスタンプ (YYYYMMDD形式、空欄なら最古から)'
        required: false
        default: ''
      to_date:
        description: '終了タイムスタンプ (YYYYMMDD形式、空欄なら最新まで)'
        required: false
        default: ''
      delay_seconds:
        description: 'リクエスト間の遅延（秒）'
        required: false
        default: '2'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Download snapshots via CDX API + id_ endpoint
        id: download
        shell: bash
        run: |
          python - <<'PYEOF'
          import requests, json, time, os, sys
          from urllib.parse import urlparse

          url = "${{ github.event.inputs.target_url }}"
          max_n = int("${{ github.event.inputs.max_snapshots }}")
          delay = float("${{ github.event.inputs.delay_seconds }}")
          from_date = "${{ github.event.inputs.from_date }}"
          to_date = "${{ github.event.inputs.to_date }}"

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.5',
              'Connection': 'keep-alive',
          }

          session = requests.Session()
          session.headers.update(headers)

          # ① CDX API でスナップショット一覧を取得（最新の statuscode:200 のみ）
          cdx_params = {
              'url': url,
              'output': 'json',
              'limit': max_n,
              'filter': 'statuscode:200',
              'collapse': 'digest',
          }
          if from_date: cdx_params['from'] = from_date
          if to_date: cdx_params['to'] = to_date

          print("Querying CDX API...")
          r = session.get('https://web.archive.org/cdx/search/cdx', params=cdx_params, timeout=60)
          if r.status_code != 200:
              print(f"CDX API error: HTTP {r.status_code}", file=sys.stderr)
              sys.exit(1)

          try:
              data = r.json()
          except Exception as e:
              print(f"CDX JSON parse error: {e}", file=sys.stderr)
              sys.exit(1)

          if len(data) < 2:
              print("No snapshots found.", file=sys.stderr)
              sys.exit(1)

          rows = data[1:]
          print(f"Found {len(rows)} snapshots (max={max_n}).")

          outdir = "downloaded-archive"
          os.makedirs(outdir, exist_ok=True)

          success = 0
          skipped = 0

          for row in rows:
              ts = row[1]
              orig = row[2]
              raw_url = f"https://web.archive.org/web/{ts}id_/{orig}"

              path = urlparse(orig).path
              ext = os.path.splitext(path)[1] or '.html'
              if len(ext) > 5 or ext not in ('.html', '.htm', '.xml', '.txt', '.css', '.js', '.json'):
                  ext = '.html'
              filename = f"{ts}{ext}"
              dst = os.path.join(outdir, filename)

              done = False
              for attempt in range(3):
                  try:
                      resp = session.get(raw_url, timeout=60, allow_redirects=True)
                      if resp.status_code == 200 and len(resp.content) > 0:
                          with open(dst, 'wb') as f:
                              f.write(resp.content)
                          print(f"  ✓ {filename} ({len(resp.content)} bytes)")
                          success += 1
                          done = True
                          break
                      elif resp.status_code == 429:
                          wait = 10 * (attempt + 1)
                          print(f"  ⏳ {ts}: 429, waiting {wait}s...")
                          time.sleep(wait)
                      elif resp.status_code == 404:
                          print(f"  ✗ {ts}: 404 Not Found (skip)")
                          done = True
                          break
                      else:
                          print(f"  ✗ {ts}: HTTP {resp.status_code} (skip)")
                          done = True
                          break
                  except Exception as e:
                      print(f"  ✗ {ts}: {e} (attempt {attempt+1})")
                      time.sleep(5)

              if not done:
                  print(f"  ⚠️ {ts}: gave up after retries")
                  skipped += 1

              time.sleep(delay)

          print(f"Done. Success: {success}, Skipped: {skipped}")
          PYEOF

      - name: Verify downloaded files
        run: |
          if [ -z "$(ls -A downloaded-archive 2>/dev/null)" ]; then
            echo "No files were downloaded." >&2
            exit 1
          fi
          EMPTY_COUNT=$(find downloaded-archive -type f -size 0 | wc -l)
          if [ "$EMPTY_COUNT" -gt 0 ]; then
            find downloaded-archive -type f -size 0 -delete
            echo "Removed $EMPTY_COUNT empty files."
          fi
          echo "Downloaded $(find downloaded-archive -type f | wc -l) non-empty files."
          ls -la downloaded-archive | head -20

      - name: Create Release and upload downloaded archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wayback-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Wayback archive: ${{ github.event.inputs.target_url }} (${{ github.run_number }})"
          body: |
            Target URL: ${{ github.event.inputs.target_url }}
            Max snapshots: ${{ github.event.inputs.max_snapshots }}
            From: ${{ github.event.inputs.from_date || '(oldest)' }}
            To: ${{ github.event.inputs.to_date || '(latest)' }}
          files: |
            downloaded-archive/**/*
          overwrite_files: true
