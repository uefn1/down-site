name: Download Wayback Machine Archive via WARP

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするサイトのURL (例: example.com)'
        required: true
        default: 'example.com'
      snapshot_timestamp:
        description: 'スナップショットのタイムスタンプ (YYYYMMDDHHMMSS形式、空欄の場合は最新を自動取得)'
        required: false
        default: ''
      crawl_depth:
        description: 'リンクを辿る深さ (1=メインページのみ)'
        required: false
        default: '2'
  schedule:
    # 毎週月曜日の午前3時 (UTC) に実行。必要に応じて変更してください。
    - cron: '0 3 * * 1'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------
      # Cloudflare WARP セットアップ (フルトンネル)
      # 以降の全通信が自動的に WARP 経由になる
      # ------------------------------------------------------------
      - name: Set up Cloudflare WARP
        uses: viperadnan-git/setup-warp@v1
        with:
          mode: client   # 公式WARPクライアントを使用
          stack: dual    # IPv4/IPv6 両対応
          retries: 3     # 接続失敗時のリトライ回数

      - name: Verify WARP connection
        run: |
          # WARP が有効か確認 (warp=on が返ればOK)
          curl -sL https://cloudflare.com/cdn-cgi/trace | grep warp
      # ------------------------------------------------------------

      - name: Install wbdownloader
        run: |
          git clone https://github.com/asofyan/wbdownloader.git
          cd wbdownloader
          pip install -r requirements.txt

      - name: Determine snapshot timestamp
        id: get_timestamp
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.snapshot_timestamp }}" ]; then
            echo "timestamp=${{ github.event.inputs.snapshot_timestamp }}" >> $GITHUB_OUTPUT
          else
            # CDX API で最新スナップショットを取得 (WARP経由)
            LATEST_TS=$(curl -s "https://web.archive.org/cdx/search/cdx?url=${{ github.event.inputs.target_url }}&output=json&limit=1&filter=statuscode:200&collapse=digest" | python -c "import sys,json; data=json.load(sys.stdin); print(data[1][1] if len(data) > 1 else '')")
            if [ -z "$LATEST_TS" ]; then
              echo "Error: スナップショットが見つかりませんでした。" >&2
              exit 1
            fi
            echo "timestamp=$LATEST_TS" >> $GITHUB_OUTPUT
          fi

      - name: Run wbdownloader (WARP tunnel is active)
        run: |
          cd wbdownloader
          python wbdownloader.py \
            -f "http://${{ github.event.inputs.target_url }}" \
            -s "${{ steps.get_timestamp.outputs.timestamp }}" \
            -o "./downloaded-archive" \
            -l "${{ github.event.inputs.crawl_depth }}" \
            -c 5

      - name: Upload downloaded archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayback-archive-${{ github.run_number }}
          path: ./wbdownloader/downloaded-archive
          retention-days: 7
