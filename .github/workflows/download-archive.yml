name: Download Wayback Machine Archive

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ダウンロードするURL (スキーム含む。例: http://www.nintendo.com)'
        required: true
        default: 'http://example.com'
      max_snapshots:
        description: 'ダウンロードするスナップショットの最大個数'
        required: true
        default: '10'
      from_date:
        description: '開始タイムスタンプ (YYYYMMDD形式、空欄なら最古から)'
        required: false
        default: ''
      to_date:
        description: '終了タイムスタンプ (YYYYMMDD形式、空欄なら最新まで)'
        required: false
        default: ''
      delay_seconds:
        description: 'リクエスト間の遅延（秒）'
        required: false
        default: '2'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install waybackpack
        run: pip install waybackpack

      - name: Download limited snapshots (rename with timestamp)
        id: download
        shell: bash
        run: |
          python - <<'PYEOF'
          import subprocess, sys, os, re, shutil

          url = "${{ github.event.inputs.target_url }}"
          max_n = int("${{ github.event.inputs.max_snapshots }}")
          from_date = "${{ github.event.inputs.from_date }}"
          to_date = "${{ github.event.inputs.to_date }}"
          delay = "${{ github.event.inputs.delay_seconds }}"

          # ① --list でスナップショット一覧を取得し、14桁のタイムスタンプを抽出
          cmd_list = ["waybackpack", url, "--list"]
          if from_date: cmd_list += ["--from-date", from_date]
          if to_date: cmd_list += ["--to-date", to_date]

          result = subprocess.run(cmd_list, capture_output=True, text=True)
          if result.returncode != 0:
              print("Failed to list snapshots:", result.stderr, file=sys.stderr)
              sys.exit(1)

          timestamps = []
          for line in result.stdout.splitlines():
              m = re.search(r'/web/(\d{14})/', line.strip())
              if m:
                  timestamps.append(m.group(1))

          print(f"Found {len(timestamps)} valid snapshots.")
          if not timestamps:
              print("No valid timestamps found.", file=sys.stderr)
              sys.exit(1)

          selected = timestamps[:max_n]
          print(f"Downloading first {len(selected)} snapshots (max_snapshots={max_n}).")

          # ② 各スナップショットを一時ディレクトリにDL → タイムスタンプ接頭辞でフラット化
          outdir = "downloaded-archive"
          os.makedirs(outdir, exist_ok=True)

          for ts in selected:
              tmpdir = f"/tmp/snapshots/{ts}"
              os.makedirs(tmpdir, exist_ok=True)

              print(f"Downloading snapshot: {ts}")
              cmd_dl = [
                  "waybackpack", url,
                  "-d", tmpdir,
                  "--from-date", ts, "--to-date", ts,
                  "--delay", delay,
                  "--ignore-errors", "--max-retries", "3"
              ]
              subprocess.run(cmd_dl, check=False)

              # スナップショット配下のファイルを収集
              files_found = []
              for root, dirs, files in os.walk(tmpdir):
                  for fname in files:
                      files_found.append(os.path.join(root, fname))

              if not files_found:
                  print(f"  [warn] No files for {ts}")
                  continue

              # メインの index.html を特定（最も浅い階層の index.html）
              main_index = None
              for fpath in sorted(files_found, key=lambda p: len(os.path.relpath(p, tmpdir))):
                  if os.path.basename(fpath) == "index.html":
                      main_index = fpath
                      break

              # コピー＆リネーム
              for fpath in files_found:
                  rel = os.path.relpath(fpath, tmpdir)
                  if fpath == main_index:
                      dst_name = f"{ts}.html"
                  else:
                      flat = rel.replace(os.sep, "_").replace("/", "_").replace("\\", "_")
                      dst_name = f"{ts}_{flat}"
                  dst = os.path.join(outdir, dst_name)
                  shutil.copy2(fpath, dst)
                  print(f"  -> {dst_name}")

          print(f"Done. Files saved under {outdir}/")
          PYEOF

      - name: Verify downloaded files
        run: |
          if [ -z "$(ls -A downloaded-archive 2>/dev/null)" ]; then
            echo "No files were downloaded." >&2
            exit 1
          fi
          echo "Downloaded $(find downloaded-archive -type f | wc -l) files."
          ls -la downloaded-archive | head -20

      - name: Create Release and upload downloaded archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wayback-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Wayback archive: ${{ github.event.inputs.target_url }} (${{ github.run_number }})"
          body: |
            Target URL: ${{ github.event.inputs.target_url }}
            Max snapshots: ${{ github.event.inputs.max_snapshots }}
            From: ${{ github.event.inputs.from_date || '(oldest)' }}
            To: ${{ github.event.inputs.to_date || '(latest)' }}
          files: |
            downloaded-archive/**/*
          overwrite_files: true
